name: Build AutoFishAndroid APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Android project
    run: |
      mkdir -p project
      unzip -o AutoFishAndroid_source.zip -d project
      find project -maxdepth 4 -type f

  - name: Build APK
    run: |
      set -euo pipefail
      gradle -p project assembleDebug --stacktrace
      mkdir -p dist
      APK="$(find project -type f -name '*.apk' | head -n 1)"
      if [ -z "$APK" ]; then
        echo "ERROR: APK was not created"
        exit 1
      fi
      cp "$APK" dist/AutoFishAndroid-debug.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AutoFishAndroid-APK
      path: dist/AutoFishAndroid-debug.apk
      if-no-files-found: error
